<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0;height:100%;background:#0b1d33;color:#eee;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center}#stage{position:relative;width:100%;max-width:1100px}canvas{display:block;width:100%;aspect-ratio:16/9;border:2px solid #000}p{font-size:13px;opacity:.85;margin:8px;text-align:center}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,14,30,.84);font-size:clamp(11px,1.7vw,17px)}
.scr{display:none;flex-direction:column;align-items:center;gap:.8em;max-height:100%;overflow:auto;padding:1em;box-sizing:border-box}.scr.act{display:flex}
.scr h1{font-size:3.2em;margin:0;letter-spacing:.12em;color:#ff5a5a;text-shadow:0 0 18px #800}.scr h2{margin:0}
.scr button{font:inherit;font-weight:700;padding:.6em 1.6em;min-width:12em;background:#1b3558;color:#fff;border:2px solid #8fd;border-radius:8px;cursor:pointer}
.scr button:hover:not(:disabled){background:#27508a}.scr button:disabled{opacity:.4;cursor:default}
.scr input{font:inherit;padding:.5em .8em;border-radius:8px;border:2px solid #8fd;background:#0c1a2e;color:#fff;text-align:center;text-transform:none}
.row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}.err{color:#ff8a8a;min-height:1.2em}
#slots{list-style:none;padding:0;margin:0;width:min(24em,90%);display:grid;gap:.3em}
#slots li{background:#16304f;padding:.4em .8em;border:1px solid #8fd;border-radius:6px;text-align:left}#slots li.empty{opacity:.4}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.card{background:#16304f;border:2px solid #456;border-radius:8px;padding:.5em .9em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2em;min-width:5.5em}
.card.taken{opacity:.45;cursor:default}.card.own{border-color:#4e6;background:#1d4a38}.card i{width:2.4em;height:2.4em;border-radius:50%;border:3px solid #000;display:block}</style></head><body>

 K.fvx+=(Math.cos(K.th)*11-K.fvx)*.06;K.fvy+=(Math.sin(K.th)*11-K.fvy)*.06;
 K.jt--;K.energy-=8/60;if(K.bc>0)K.bc--;
 const n=4;let hx=0,hy=0;
 for(let i=0;i<n&&!hx&&!hy;i++){
  const nx=K.fx+K.fvx/n;if(blockedAt(nx,K.fy))hx=1;else K.fx=nx;
  const ny=K.fy+K.fvy/n;if(blockedAt(K.fx,ny))hy=1;else K.fy=ny;
  if(!D.dead&&D.inv<=0&&Math.abs(K.fx-D.x)<36&&Math.abs(K.fy-(D.y-30))<52){hurt(20);D.inv=30;K.lastHit=tick}
 }
 K.x=K.fx;K.y=K.fy+35;
 const dx=Math.cos(K.th),dy=Math.sin(K.th);
 for(let i=0;i<5;i++)emit(K.fx-dx*36+(Math.random()-.5)*8,K.fy-dy*36+(Math.random()-.5)*8,-dx*(2+Math.random()*3)+(Math.random()-.5)*1.6,-dy*(2+Math.random()*3)+(Math.random()-.5)*1.6,8+Math.random()*8,16+Math.random()*14);
 if(hx||hy){
  if(K.bc>0||K.shield){
   if(K.bc<=0){K.shield=0;K.bc=12;msg='¡Escudo roto! rebotaste';msgT=70;bounceFx()}
   if(hx)K.fvx*=-.9;if(hy)K.fvy*=-.9;K.th=Math.atan2(K.fvy,K.fvx);
  }else{
   if(tick-K.lastHit<=10&&!D.dead){hurt(35);msg='¡COMBO! daño extra al sobreviviente';msgT=100}
   else if(tick-K.lastHit<=10){msg='¡COMBO! sobreviviente eliminado';msgT=100}
   endJet(120);return;
  }
 }
 if(K.jt<=0||K.energy<=0){K.energy=Math.max(0,K.energy);endJet(0)}
}
const mkS=i=>({x:SPAWN[i][0]*T+16,y:SPAWN[i][1]*T,vx:0,vy:0,w:24,h:60,face:-1,ground:0,t:0,ang:0,jumping:0,in:{l:0,r:0,j:0},maxS:8.4,kick:0,kcd:0,hp:100,maxhp:100,inv:0,dead:0,on:0,name:'',col:COLS[i],ghost:1,cc:[],peer:null,boost:0,ha:0,ha0:0,bo:0});
function useAtk(){if(role!='k'||K.att>0||K.acd>0||K.jet!='none'||K.stun>0)return;K.att=24;K.ah=0;K.hb=0}
function updS(s){
 const I=s.in;
 if(s.dead){I.l=I.r=I.j=0;return}
 I.l=keys.a||keys.arrowleft?1:0;I.r=keys.d||keys.arrowright?1:0;I.j=keys.w||keys.arrowup||keys[' ']?1:0;
 if(s.kcd>0)s.kcd--;if(s.inv>0)s.inv--;
 if(s.boost>0)s.boost--;s.maxS=s.boost>0?11:8.4;
 if(s.kick>0){s.kick--;I.l=I.r=I.j=0}
 else if((keys.x||keys.j||kickReq)&&s.kcd<=0&&s.ground){s.kick=30;s.kcd=240}
 kickReq=0;
 step(s);
 for(let i=0;i<coins.length;i++){const c=coins[i];if(!c.gone&&Math.hypot(c.x-s.x,c.y-s.y+30)<28){c.gone=1;s.cc.push(i);pts++;if(pts>=8){pts=0;s.hp=Math.min(s.maxhp,s.hp+40)}}}
 if(K.on&&s.inv<=0){
  if(K.att>=8&&K.att<=16){const rx=(s.x-K.x)*K.face;if(rx>-22&&rx<87&&Math.abs((s.y-30)-(K.y-35))<65){s.hp-=20;s.inv=40;s.vx=K.face*7;s.vy=-5;s.ground=0;s.boost=150;s.ha++;msg='¡Impulso de velocidad!';msgT=60}}
  else if(K.jet=='fly'&&Math.abs(K.fx-s.x)<36&&Math.abs(K.fy-(s.y-30))<52){s.hp-=20;s.inv=30;s.vx=Math.cos(K.th)*5;s.vy=-4;s.ground=0}
 }
 if(s.hp<=0){s.hp=0;s.dead=1}
}
function netApply(){
 const by={};for(const p of net.r.peers())by[p.peer]=p;
 const sm=(o,q)=>{if(o.tx===undefined){o.x=q.x;o.y=q.y}o.tx=q.x;o.ty=q.y;o.x+=(o.tx-o.x)*.5;o.y+=(o.ty-o.y)*.5};
 if(K.ghost&&K.peer){
  const p=by[K.peer];
  if(!p)K.on=0;else{const q=p.presence;if(q.x!==undefined){K.on=1;sm(K,q);K.vx=q.vx;K.face=q.face;K.ground=q.g;K.jet=['none','charge','fly'][q.jet|0];K.fx=q.fx;K.fy=q.fy;K.th=q.th;K.shield=q.sh;K.att=q.att;K.stun=q.stun;K.ang=q.ang;if(K.jet=='fly'){K.x=K.fx;K.y=K.fy+35}}}
 }
 for(const o of SV){
  if(!o.on||!o.ghost)continue;
  const p=by[o.peer];if(!p){o.dead=1;continue}
  const q=p.presence;if(q.x===undefined)continue;
  sm(o,q);o.vx=q.vx;o.face=q.face;o.ground=q.g;o.kick=q.kick;o.hp=q.hp;o.dead=q.dead;o.inv=q.inv;o.t++;o.bo=q.bo|0;if((q.ha|0)>o.ha0){o.ha0=q.ha|0;if(role=='k'){if(K.att>0)K.hb=1;else if(K.acd>0){K.acd+=60;K.am=K.acd}msg='¡Golpe! +1 s de enfriamiento';msgT=60}}
  if(q.cc)for(const i of q.cc)if(coins[i])coins[i].gone=1;
 }
}
function netSend(){
 if(tick%3)return;
 const f=v=>Math.round(v*10)/10;
 if(role=='k')net.r.presence({x:f(K.x),y:f(K.y),vx:f(K.vx),face:K.face,g:K.ground?1:0,jet:K.jet=='fly'?2:K.jet=='charge'?1:0,fx:f(K.fx),fy:f(K.fy),th:Math.round(K.th*100)/100,sh:K.shield,att:K.att,stun:K.stun,ang:Math.round(K.ang*100)/100});
 else{const o=me;net.r.presence({x:f(o.x),y:f(o.y),vx:f(o.vx),face:o.face,g:o.ground?1:0,kick:o.kick,hp:o.hp,dead:o.dead,inv:o.inv,cc:o.cc,ha:o.ha,bo:o.boost>0?1:0})}
}
function checkEnd(){
 if(endShown)return;
 const on=SV.filter(o=>o.on);
 if(on.length&&on.every(o=>o.dead))finish('¡R11 gana! Todos los sobrevivientes fueron eliminados');
 else if(Date.now()>=tEnd)finish('¡Ganan los sobrevivientes! Se acabó el tiempo');
}
function finish(t){endShown=1;scene='end';$('end-t').textContent=t;showScr('m-end')}
function update(){
 const kl=keys.a||keys.arrowleft?1:0,kr=keys.d||keys.arrowright?1:0,ku=keys.w||keys.arrowup||keys[' ']?1:0,kd=keys.s||keys.arrowdown?1:0;
 if(!solo)netApply();
 if(role=='k'){
  K.in.l=kl;K.in.r=kr;K.in.j=ku;
  if(keys.z&&!zHeld){zHeld=1;useJet()}if(!keys.z)zHeld=0;
  const ax=keys.x||keys.j;if(ax&&!xHeld){xHeld=1;useAtk()}if(!ax)xHeld=0;
  if(K.stun>0){K.stun--;K.att=0;K.in.l=K.in.r=K.in.j=0;if(K.jet=='charge')endJet(K.stun)}
  if(solo){
   if(D.dead){if(--D.dt<=0)Object.assign(D,{x:100*T+16,y:40*T,vx:0,vy:0,hp:100,dead:0,inv:0,kick:0,kcd:0,tm:0,mode:'wander'})}
   else{aiD();step(D);if(D.blocked===0&&D.vx===0&&D.in.l+D.in.r>0)D.blocked=1;if(D.inv>0)D.inv--;if(D.boost>0)D.boost--}
  }else{
   for(const o of SV){
    if(!o.on||o.dead||!o.ghost)continue;
    if(o.kick<=20&&o.kick>=10){const dx=K.x-o.x,dy=K.y-o.y;if(K.stun<=0&&K.jet!='fly'&&Math.sign(dx)==o.face&&Math.abs(dx)<78&&Math.abs(dy)<60){K.stun=90;K.att=0;K.vx=o.face*6;K.vy=-4;K.ground=0}}
   }
  }
  if(K.jet=='charge'){
   K.vx=K.vy=0;K.jt--;K.energy-=10/180;
   if(K.jt<100&&K.jt%2==0)emit(K.x-K.face*6,K.y-4,(Math.random()-.5)*2,1+Math.random()*2,4+Math.random()*4,14);
   if(K.jt<=0){K.jet='fly';K.jt=600;K.th=-Math.PI/2;K.fx=K.x;K.fy=K.y-35;K.fvx=0;K.fvy=-11;K.shield=1;K.bc=0;K.lastHit=-99;K.ang=0}
  }else if(K.jet=='fly')flyStep(kl,kr,ku,kd);
  else{step(K);if(K.cd>0)K.cd--;K.energy=Math.min(100,K.energy+3/60);if(K.att>0){K.att--;if(K.att==0){K.acd=70+(K.hb?60:0);K.am=K.acd;K.hb=0}}else if(K.acd>0)K.acd--}
  if(solo&&K.att>=8&&K.att<=16&&!K.ah&&!D.dead&&D.inv<=0){const rx=(D.x-K.x)*K.face;if(rx>-22&&rx<87&&Math.abs((D.y-30)-(K.y-35))<65){hurt(20,K.face);D.inv=30;D.vx=K.face*7;D.vy=-5;D.ground=0;K.ah=1;D.boost=150;K.hb=1;msg='¡Golpe! +1 s de enfriamiento';msgT=60}}
 }else{
  updS(me);
  if(K.on&&K.jet=='fly'){const dx=Math.cos(K.th),dy=Math.sin(K.th);for(let i=0;i<4;i++)emit(K.fx-dx*36+(Math.random()-.5)*8,K.fy-dy*36+(Math.random()-.5)*8,-dx*(2+Math.random()*3),-dy*(2+Math.random()*3),8+Math.random()*8,16+Math.random()*14)}
 }
 for(let i=ps.length-1;i>=0;i--){const q=ps[i];q.x+=q.vx;q.y+=q.vy;if(--q.l<=0)ps.splice(i,1)}
 if(msgT>0)msgT--;
 music();springs.forEach(s=>{if(s.a>0)s.a--});tick++;
 if(!solo){netSend();checkEnd()}
}
function resetWorld(){
 Object.assign(K,{x:8*T+16,y:44*T,vx:0,vy:0,ang:0,stun:0,jet:'none',shield:0,energy:100,cd:0,jt:0,att:0,acd:0,ah:0,tx:undefined});
 ps.length=0;coins.forEach(c=>c.gone=0);pts=0;mode=0;
 Object.assign(D,{x:100*T+16,y:40*T,vx:0,vy:0,kick:0,kcd:0,mode:'wander',tm:0,hp:100,dead:0,inv:0});
}
function reset(){if(solo&&scene=='play')resetWorld()}
// ---------- menus / salas ----------
const $=id=>document.getElementById(id);
function showScr(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('act'));$('ui').style.display=id?'flex':'none';if(id)$(id).classList.add('act')}
function errMsg(t){$('err').textContent=t}
async function leaveRoom(){if(net){const n=net;net=null;try{n.unsub&&n.unsub();await n.r.leave()}catch(e){}}}
async function toMenu(){await leaveRoom();scene='menu';solo=true;role='k';me=K;K.on=1;K.ghost=0;SV=[];resetWorld();showScr('m-main')}
function startSolo(){solo=true;role='k';me=K;K.on=1;K.ghost=0;SV=[];resetWorld();scene='play';endShown=0;showScr('')}
const genCode=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<8;i++)o+=c[Math.floor(Math.random()*c.length)];return o};
const ordered=()=>net.r.peers().filter(p=>p.kind=='viewer').slice().sort((a,b)=>(b.presence.host||0)-(a.presence.host||0)||(a.presence.jt||0)-(b.presence.jt||0));
async function enterRoom(code,host){
 errMsg('');
 let rm=null;try{rm=typeof claude!='undefined'?await claude.use('room'):null}catch(e){}
 if(!rm){errMsg('Las salas no están disponibles aquí. Abre el juego desde su enlace compartido de Claude.');return false}
 let r;try{r=await rm.join('r11-'+code.toLowerCase())}catch(e){errMsg('No se pudo entrar a la sala ('+((e&&e.code)||'error')+')');return false}
 net={r,code,host,joined:host};
 r.presence({nick,host:host?1:0,jt:Date.now(),phase:host?'lobby':'-'});
 net.unsub=r.onPeers(onPeers);
 return true;
}
async function createRoom(){
 const code=genCode();if(!await enterRoom(code,true))return;
 scene='lobby';$('code').textContent=code;showScr('m-lobby');renderLobby();
}
async function joinByCode(){
 const code=($('code-in').value||'').trim().toUpperCase();
 if(code.length!=8){errMsg('El código tiene 8 caracteres');return}
 if(!await enterRoom(code,false))return;
 errMsg('Buscando sala…');
 await new Promise(r=>setTimeout(r,2500));
 if(!net)return;
 const ps=ordered();
 if(!ps.some(p=>p.presence.host==1)){await leaveRoom();errMsg('Sala no encontrada');return}
 const mi=ps.findIndex(p=>p.isMe&&p.sameTab);
 if(mi>=8){await leaveRoom();errMsg('La sala está llena (8/8)');return}
 const ph=ps.find(p=>p.presence.host==1).presence.phase;
 if(ph!='lobby'){await leaveRoom();errMsg('Esa partida ya empezó');return}
 net.joined=true;errMsg('');scene='lobby';$('code').textContent=code;showScr('m-lobby');renderLobby();
}
function renderLobby(){
 const ps=ordered(),ul=$('slots');ul.textContent='';
 for(let i=0;i<8;i++){const li=document.createElement('li'),p=ps[i];
  if(p){li.textContent=(i+1)+'. '+(p.presence.nick||'Jugador')+(p.presence.host==1?' (anfitrión)':'')+(p.isMe&&p.sameTab?' · tú':'')}
  else{li.textContent=(i+1)+'. — libre —';li.className='empty'}
  ul.appendChild(li)}
 $('b-start').style.display=net.host?'':'none';
 $('lob-info').textContent=net.host?'Comparte el código con tus amigos y pulsa Comenzar Juego.':'Esperando a que el anfitrión comience…';
}
function owners(){const o={};for(const p of ordered()){const k=p.presence.pick;if(!k)continue;const t=p.presence.pt||0;if(!o[k]||t<o[k].t||(t==o[k].t&&p.peer<o[k].p.peer))o[k]={p,t}}return o}
function enterSelect(){scene='select';showScr('m-select');renderSelect()}
function renderSelect(){
 const o=owners(),mine=net.r.peers().find(p=>p.isMe&&p.sameTab);
 if(mine&&mine.presence.pick&&(!o[mine.presence.pick]||!o[mine.presence.pick].p.sameTab))net.r.presence({pick:null,pt:null});
 const box=$('cards');box.textContent='';
 CH.forEach(([id,name],i)=>{
  const ow=o[id],d=document.createElement('div');d.className='card'+(ow?(ow.p.sameTab?' own':' taken'):'');
  const av=document.createElement('i');av.style.background=id=='k'?'#888':COLS[i-1];
  const b=document.createElement('b');b.textContent=name;const sm=document.createElement('small');sm.textContent=ow?(ow.p.presence.nick||'?'):'libre';
  d.append(av,b,sm);
  d.onclick=()=>{if(!ow||ow.p.sameTab)net.r.presence({pick:id,pt:Date.now()})};
  box.appendChild(d)});
 const ps=ordered(),all=ps.every(p=>{const k=p.presence.pick;return k&&o[k]&&o[k].p===p}),hasS=Object.keys(o).some(k=>k!='k');
 $('b-go').style.display=net.host?'':'none';$('b-go').disabled=!(all&&o.k&&hasS);
 $('sel-info').textContent=net.host?(all&&o.k&&hasS?'Todo listo: pulsa Iniciar partida.':'Todos deben elegir personaje; hace falta R11 y al menos 1 dummy.'):'Elige tu personaje. El primero que lo elige se lo queda.';
}
function onPeers(){
 if(!net)return;
 const ps=ordered(),h=ps.find(p=>p.presence.host==1);
 if(!h){if(net.joined&&scene!='menu'){toMenu().then(()=>{});}return}
 const ph=h.presence.phase;
 if(scene=='lobby'){renderLobby();if(ph=='select')enterSelect()}
 else if(scene=='select'){renderSelect();if(ph=='play')startOnline()}
}
function startOnline(){
 const o=owners(),mine=net.r.peers().find(p=>p.isMe&&p.sameTab),pk=mine&&mine.presence.pick;
 if(!pk)return;
 solo=false;resetWorld();SV=[];
 K.on=1;K.ghost=pk!='k';K.peer=o.k?o.k.p.peer:null;K.name=o.k?o.k.p.presence.nick:'';
 for(let i=0;i<7;i++){const ow=o['s'+(i+1)],v=mkS(i);v.on=!!ow;v.peer=ow?ow.p.peer:null;v.name=ow?ow.p.presence.nick:'';v.ghost=!(ow&&ow.p.sameTab);SV.push(v)}
 role=pk=='k'?'k':'s';me=role=='k'?K:SV[+pk.slice(1)-1];
 D.dead=1;D.dt=1e9;
 tEnd=Date.now()+120000;endShown=0;scene='play';showScr('');tick=0;
}
$('b-play').onclick=startSolo;
$('b-salas').onclick=()=>showScr('m-nick');
$('b-nick').onclick=()=>{nick=($('nick').value||'').trim().slice(0,12)||'Jugador';errMsg('');showScr('m-salas')};
$('nick').onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')$('b-nick').click()};
$('code-in').onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')$('b-join').click()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>showScr(b.dataset.back));
$('b-create').onclick=createRoom;$('b-join').onclick=joinByCode;
$('b-start').onclick=()=>{if(net&&net.host){net.r.presence({phase:'select'});enterSelect()}};
$('b-go').onclick=()=>{if(net&&net.host&&!$('b-go').disabled){net.r.presence({phase:'play',st:Date.now()});startOnline()}};
$('b-leave').onclick=toMenu;$('b-menu').onclick=toMenu;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;unlocked=1;initAudio();if(k=='r')reset();if(k=='escape'&&scene!='menu')toMenu();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
cv.addEventListener('pointerdown',e=>{unlocked=1;initAudio();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*540/r.height;if(scene!='play')return;if(Math.hypot(x-900,y-470)<46){if(role=='k')useJet();else kickReq=1}if(role=='k'&&Math.hypot(x-820,y-470)<46)useAtk()});
let last=performance.now(),acc=0;
(function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){if(scene=='play')update();acc-=1000/60}render();requestAnimationFrame(loop)})(last);
</script></body></html>
